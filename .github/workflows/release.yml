name: Release

# Publishes a GitHub Release with the binaries for every platform.
#
# - Every push to main that passes CI is released automatically (ci.yml calls
#   this workflow). The version is the next patch after the latest v* tag, or
#   the next minor or major when a commit message says [minor] or [major].
#   Pushes that change nothing in the program (README, CI, tests) are skipped.
# - Run this workflow by hand (Actions › Release › Run workflow) to release
#   now and choose the bump yourself.
# - Push a tag such as v1.2.3 to release exactly that version.
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        default: false
      bump:
        type: string
        default: auto
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # One release at a time, so two pushes cannot claim the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'auto' }}
          FROM_CI: ${{ inputs.from_ci && 'true' || 'false' }}
        run: bash .github/release-version.sh
      - name: Test
        if: steps.version.outputs.tag != '' && !inputs.from_ci
        run: go test ./...
      # Signing the macOS binaries is optional: without the MACOS_* secrets
      # they are published unsigned. Half a set is a mistake, and stops here
      # before anything is tagged. Only whether each secret exists is read.
      - name: Signing
        if: steps.version.outputs.tag != ''
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 != '' }}
          ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID != '' }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID != '' }}
          KEY: ${{ secrets.MACOS_NOTARY_KEY != '' }}
        run: |
          case "$P12 $ISSUER $KEY_ID $KEY" in
          "true true true true") echo "The macOS binaries will be signed and notarized." ;;
          "false false false false") echo "::notice::The macOS binaries are published unsigned: the MACOS_* secrets are not set (see Signing in the README)." ;;
          *)
            echo "::error::Set all of MACOS_SIGN_P12, MACOS_NOTARY_ISSUER_ID, MACOS_NOTARY_KEY_ID and MACOS_NOTARY_KEY, or none of them."
            exit 1
            ;;
          esac
      - name: Tag
        if: steps.version.outputs.tag != '' && !startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: steps.version.outputs.tag != ''
        with:
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
