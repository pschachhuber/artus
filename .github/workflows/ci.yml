name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/artus
      # The install scripts against the latest release, the second run over
      # the first install.
      - name: Install script
        if: runner.os == 'Linux'
        run: |
          ARTUS_INSTALL_DIR="$RUNNER_TEMP/artus" sh install.sh
          ARTUS_INSTALL_DIR="$RUNNER_TEMP/artus" sh install.sh
          "$RUNNER_TEMP/artus/artus" version
      - name: Install script
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1, as most people run it, the way they run it.
        shell: powershell
        run: |
          $env:ARTUS_INSTALL_DIR = "$env:RUNNER_TEMP\artus"
          Get-Content -Raw install.ps1 | Invoke-Expression
          Get-Content -Raw install.ps1 | Invoke-Expression
          artus version
          if ($LASTEXITCODE) { exit 1 }
          $path = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';'
          if (@($path | Where-Object { $_ -eq $env:ARTUS_INSTALL_DIR }).Count -ne 1) { throw "PATH holds the folder not exactly once: $path" }

  # A job of its own because GitHub at times has no macOS runner to give.
  # macos-gate below tells that apart from a failing test.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/artus
      # Also shows that the installed program is not quarantined, so
      # Gatekeeper does not stop it.
      - name: Install script
        run: |
          ARTUS_INSTALL_DIR="$RUNNER_TEMP/artus" sh install.sh
          "$RUNNER_TEMP/artus/artus" version
          if xattr -p com.apple.quarantine "$RUNNER_TEMP/artus/artus" 2>/dev/null; then
            echo "::error::The installed program is quarantined"
            exit 1
          fi

  # Whether the macOS tests let a release through. When GitHub has no macOS
  # runner, test-macos ends after 15 minutes without running a step: it shows
  # as cancelled, but its result reads "abandoned", a value GitHub does not
  # document. Rather than rely on it, this asks whether the job ran any step:
  # tests that passed or never started let the release go ahead on the Linux
  # and Windows results, tests that ran and did not pass stop it. Runs on
  # pull requests too, so it stays tested.
  macos-gate:
    needs: [test, test-macos]
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: macOS tests
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.test-macos.result }}
        run: |
          steps=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest" \
            --jq '.jobs[] | select(.name == "test-macos") | .steps | length')
          echo "test-macos: result $RESULT, steps run: ${steps:-job not found}"
          if [[ $RESULT == success ]]; then
            exit 0
          elif [[ $steps == 0 ]]; then
            echo "::notice::GitHub had no macOS runner, so the macOS tests did not run. A release goes ahead on the Linux and Windows results."
            exit 0
          fi
          echo "::error::The macOS tests ran and did not pass ($RESULT)."
          exit 1

  # A push to main that passes is published as a release.
  release:
    needs: [macos-gate]
    # needs.test passed, or macos-gate would not have run.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.macos-gate.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # The signing secrets; a called workflow sees none it is not given.
    secrets: inherit
    with:
      from_ci: true
