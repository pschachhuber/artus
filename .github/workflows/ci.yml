name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/artus
      # The install scripts against the latest release, the second run over
      # the first install.
      - name: Install script
        if: runner.os == 'Linux'
        run: |
          ARTUS_INSTALL_DIR="$RUNNER_TEMP/artus" sh install.sh
          ARTUS_INSTALL_DIR="$RUNNER_TEMP/artus" sh install.sh
          "$RUNNER_TEMP/artus/artus" version
      - name: Install script
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1, as most people run it, the way they run it.
        shell: powershell
        run: |
          $env:ARTUS_INSTALL_DIR = "$env:RUNNER_TEMP\artus"
          Get-Content -Raw install.ps1 | Invoke-Expression
          Get-Content -Raw install.ps1 | Invoke-Expression
          artus version
          if ($LASTEXITCODE) { exit 1 }
          $path = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';'
          if (@($path | Where-Object { $_ -eq $env:ARTUS_INSTALL_DIR }).Count -ne 1) { throw "PATH holds the folder not exactly once: $path" }

  # A job of its own because GitHub at times has no macOS runner to give: the
  # job is then cancelled after a while, and that alone does not hold back a
  # release. A failing macOS test does.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/artus
      # Also shows that the installed program is not quarantined, so
      # Gatekeeper does not stop it.
      - name: Install script
        run: |
          ARTUS_INSTALL_DIR="$RUNNER_TEMP/artus" sh install.sh
          "$RUNNER_TEMP/artus/artus" version
          if xattr -p com.apple.quarantine "$RUNNER_TEMP/artus/artus" 2>/dev/null; then
            echo "::error::The installed program is quarantined"
            exit 1
          fi

  # A push to main that passes is published as a release.
  release:
    needs: [test, test-macos]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      (needs.test-macos.result == 'success' || needs.test-macos.result == 'cancelled')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # The signing secrets; a called workflow sees none it is not given.
    secrets: inherit
    with:
      from_ci: true
