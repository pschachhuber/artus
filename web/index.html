<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Artus">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Artus</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Chats and navigation"></aside>
    <div id="scrim"></div>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>
  <noscript>Artus needs JavaScript to run its interface.</noscript>
</body>
</html>
